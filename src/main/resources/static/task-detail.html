<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Task Detail</title>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div id="detail-container">
        <div class="loading-spinner"><div class="spinner"></div> Loading task…</div>
      </div>
    </div>
  </div>
</div>

<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="js/activity.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
if (!initPage('tasks', 'Task Detail')) throw new Error('Not authenticated');

var params = new URLSearchParams(location.search);
var taskId  = params.get('id');
if (!taskId) window.location.href = 'tasks.html';

var currentUser = Api.getUser();

// ─── Load everything ──────────────────────────────────────────────────────────
async function loadDetail() {
  var [task, comments, attachments] = await Promise.all([
    Api.getTask(taskId),
    Api.getComments(taskId),
    Api.getAttachments(taskId)
  ]);

  var container = document.getElementById('detail-container');
  if (!task) {
    container.innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">❌</div>' +
      '<h6>Task not found</h6>' +
      '<a href="tasks.html" style="color:var(--accent-blue)">← Back to tasks</a></div>';
    return;
  }

  container.innerHTML =
    '<div style="display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start" id="detail-grid">' +

    // ── LEFT COLUMN ─────────────────────────────────────────────────────────
    '<div>' +

      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">' +
        '<a href="tasks.html" class="btn btn-secondary btn-sm">← Back</a>' +
        '<span style="color:var(--text-muted);font-family:monospace;font-size:12px">#' + task.id + '</span>' +
      '</div>' +

      '<div class="task-detail-header">' +
        '<h1 class="task-detail-title">' + _esc(task.title) + '</h1>' +
        '<div class="task-detail-meta">' +
          statusBadge(task.status) +
          priorityBadge(task.priority) +
          '<div class="task-meta-item">📅 ' + formatDate(task.dueDate) + '</div>' +
          '<div class="task-meta-item">👤 ' + _esc((task.assignedUser && task.assignedUser.name) || 'Unassigned') + '</div>' +
        '</div>' +
      '</div>' +

      (task.description
        ? '<div class="task-description">' + _esc(task.description) + '</div>'
        : '') +

      // Status update
      '<div class="card" style="margin-bottom:20px">' +
        '<div class="card-header"><div class="card-header-title">🔄 Quick Status Update</div></div>' +
        '<div class="card-body" style="display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px">' +
          ['BACKLOG','IN_PROGRESS','REVIEW','QA','BLOCKED','DONE'].map(function(s) {
            var labels = {BACKLOG:'📥 Backlog',IN_PROGRESS:'🔵 In Progress',REVIEW:'🧐 Review',
                          QA:'🧪 QA',BLOCKED:'⛔ Blocked',DONE:'✅ Done'};
            var cls = s === task.status ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm';
            return '<button class="' + cls + '" id="sbtn-' + s + '" onclick="updateStatus(\'' + s + '\')">' +
              labels[s] + '</button>';
          }).join('') +
        '</div>' +
      '</div>' +

      // ── COMMENTS ──────────────────────────────────────────────────────────
      '<div class="card" style="margin-bottom:20px">' +
        '<div class="card-header"><div class="card-header-title">💬 Comments</div></div>' +
        '<div class="card-body">' +
          '<div id="comments-list">' + renderComments(comments || []) + '</div>' +
          '<div style="margin-top:16px;border-top:1px solid var(--border-color);padding-top:16px">' +
            '<textarea id="new-comment" class="form-control" rows="2" ' +
              'placeholder="Add a comment…" style="margin-bottom:10px"></textarea>' +
            '<button class="btn btn-primary btn-sm" onclick="addComment()">💬 Post Comment</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // ── ATTACHMENTS ───────────────────────────────────────────────────────
      '<div class="card">' +
        '<div class="card-header">' +
          '<div class="card-header-title">📎 Attachments</div>' +
          '<button class="btn btn-primary btn-sm" onclick="triggerUpload()">+ Add File</button>' +
        '</div>' +
        '<div class="card-body">' +
          '<input type="file" id="file-input" style="display:none" onchange="uploadFile(event)" />' +
          '<div id="attachments-list">' + renderAttachments(attachments || []) + '</div>' +
          '<div id="upload-progress" style="display:none;margin-top:10px">' +
            '<div style="height:4px;background:var(--border-color);border-radius:4px;overflow:hidden">' +
              '<div style="height:100%;background:var(--accent-blue);width:100%;animation:pulse 1s infinite"></div>' +
            '</div>' +
            '<div style="font-size:12px;color:var(--text-muted);margin-top:6px">Uploading…</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

    '</div>' +

    // ── RIGHT COLUMN — Activity Log ────────────────────────────────────────
    '<div>' +
      '<div class="card" style="position:sticky;top:78px">' +
        '<div class="card-header"><div class="card-header-title">📜 Activity Log</div></div>' +
        '<div class="card-body" style="max-height:600px;overflow-y:auto;padding:12px 16px">' +
          '<div id="activity-timeline"><div class="loading-spinner"><div class="spinner"></div></div></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '</div>';  // detail-grid

  Activity.load(taskId);
}

// ─── Render helpers ───────────────────────────────────────────────────────────

function renderComments(list) {
  if (!list.length) {
    return '<div style="text-align:center;color:var(--text-muted);padding:20px">No comments yet</div>';
  }
  return list.map(function(c) {
    var name  = (c.user && c.user.name) || 'User';
    var isOwn = currentUser && c.user && c.user.id === currentUser.id;
    return '<div class="comment-item">' +
      '<div class="comment-avatar">' + getInitials(name) + '</div>' +
      '<div class="comment-body">' +
        '<div class="comment-meta"><strong>' + _esc(name) + '</strong> · ' + timeAgo(c.createdAt) + '</div>' +
        '<div class="comment-text" id="ct-' + c.id + '">' + _esc(c.content || '') + '</div>' +
        (isOwn
          ? '<div style="margin-top:6px;display:flex;gap:8px">' +
              '<button class="btn btn-secondary btn-sm" onclick="editComment(' + c.id + ')">✏️ Edit</button>' +
              '<button class="btn btn-danger btn-sm"    onclick="delComment(' + c.id + ')">🗑 Delete</button>' +
            '</div>'
          : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function renderAttachments(list) {
  if (!list.length) {
    return '<div style="text-align:center;color:var(--text-muted);padding:20px">' +
      '📎 No attachments yet</div>';
  }

  function fileIcon(type) {
    if (!type) return '📄';
    if (type.startsWith('image/'))       return '🖼';
    if (type === 'application/pdf')      return '📄';
    if (type.includes('spreadsheet') ||
        type.includes('excel'))          return '📊';
    if (type.includes('zip') ||
        type.includes('compressed'))     return '🗜';
    return '📁';
  }

  function fmtSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024)         return bytes + ' B';
    if (bytes < 1024*1024)    return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/(1024*1024)).toFixed(1) + ' MB';
  }

  return list.map(function(a) {
    var isOwner = currentUser && a.uploadedBy && a.uploadedBy.id === currentUser.id;
    var role    = ((currentUser?.role?.name || currentUser?.role || '') + '').toUpperCase();
    var canDel  = isOwner || role === 'ADMIN' || role === 'MANAGER';

    return '<div style="display:flex;align-items:center;gap:10px;padding:10px;' +
        'border:.5px solid var(--border-color);border-radius:8px;margin-bottom:8px">' +
      '<div style="font-size:24px">' + fileIcon(a.fileType) + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;' +
            'text-overflow:ellipsis">' + _esc(a.originalFileName) + '</div>' +
        '<div style="font-size:11px;color:var(--text-muted)">' +
          fmtSize(a.fileSize) +
          (a.uploadedBy ? ' · ' + _esc(a.uploadedBy.name) : '') +
          (a.createdAt ? ' · ' + timeAgo(a.createdAt) : '') +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-shrink:0">' +
        '<a href="' + Api.getAttachmentDownloadUrl(a.id) + '" ' +
           'class="btn btn-secondary btn-sm" download>⬇</a>' +
        (canDel
          ? '<button class="btn btn-danger btn-sm" onclick="deleteAttachment(' + a.id + ')">🗑</button>'
          : '') +
      '</div>' +
    '</div>';
  }).join('');
}

// ─── Comment actions ──────────────────────────────────────────────────────────

async function addComment() {
  var el      = document.getElementById('new-comment');
  var content = el.value.trim();
  if (!content) { Toast.warning('Please enter a comment.'); return; }
  var r = await Api.addComment(taskId, content);
  if (r) {
    el.value = '';
    Toast.success('Comment added!');
    reloadComments();
    Activity.load(taskId);
  }
}

async function editComment(id) {
  var el      = document.getElementById('ct-' + id);
  var newText = prompt('Edit comment:', el.textContent.trim());
  if (!newText || !newText.trim()) return;
  var r = await Api.updateComment(id, newText.trim());
  if (r) { Toast.success('Comment updated'); reloadComments(); }
}

async function delComment(id) {
  if (!confirm('Delete this comment?')) return;
  var r = await Api.deleteComment(id);
  if (r !== false) { Toast.success('Comment deleted'); reloadComments(); }
}

async function reloadComments() {
  var comments = await Api.getComments(taskId);
  document.getElementById('comments-list').innerHTML = renderComments(comments || []);
}

window.addComment   = addComment;
window.editComment  = editComment;
window.delComment   = delComment;

// ─── Attachment actions ───────────────────────────────────────────────────────

function triggerUpload() {
  document.getElementById('file-input').click();
}
window.triggerUpload = triggerUpload;

async function uploadFile(event) {
  var file = event.target.files[0];
  if (!file) return;

  var progress = document.getElementById('upload-progress');
  progress.style.display = 'block';

  var formData = new FormData();
  formData.append('file', file);

  var r = await Api.uploadAttachment(taskId, formData);
  progress.style.display = 'none';
  event.target.value = ''; // reset so same file can be re-selected

  if (r) {
    Toast.success('File uploaded: ' + file.name);
    reloadAttachments();
    Activity.load(taskId);
  } else {
    Toast.error('Upload failed. Check file type and size (max 10MB).');
  }
}
window.uploadFile = uploadFile;

async function reloadAttachments() {
  var list = await Api.getAttachments(taskId);
  document.getElementById('attachments-list').innerHTML = renderAttachments(list || []);
}

async function deleteAttachment(id) {
  if (!confirm('Delete this attachment?')) return;
  var r = await Api.deleteAttachment(id);
  if (r !== false) { Toast.success('Attachment deleted'); reloadAttachments(); }
}
window.deleteAttachment = deleteAttachment;

// ─── Status update ────────────────────────────────────────────────────────────

async function updateStatus(newStatus) {
  var r = await Api.updateTaskStatus(taskId, newStatus);
  if (r) {
    Toast.success('Status → ' + newStatus.replace(/_/g,' '));
    // Re-highlight all buttons
    ['BACKLOG','IN_PROGRESS','REVIEW','QA','BLOCKED','DONE'].forEach(function(s) {
      var btn = document.getElementById('sbtn-' + s);
      if (btn) btn.className = s === newStatus
        ? 'btn btn-primary btn-sm'
        : 'btn btn-secondary btn-sm';
    });
    Activity.load(taskId);
  }
}
window.updateStatus = updateStatus;

// ─── Init ─────────────────────────────────────────────────────────────────────
loadDetail();
</script>

<style>
@media (max-width: 900px) {
  #detail-grid { grid-template-columns: 1fr !important; }
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: .4; }
}
</style>
</body>
</html>
