<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Teams</title>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">

      <!-- Page header -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="margin:0;font-size:20px;font-weight:700">Teams</h2>
          <p style="margin:0;font-size:13px;color:var(--text-muted)">Manage your teams, members, and team leads</p>
        </div>
        <button id="btn-create-team" class="btn btn-primary" style="display:none">
          + Create Team
        </button>
      </div>

      <!-- Teams grid -->
      <div id="teams-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px">
        <div class="loading-spinner" style="grid-column:1/-1"><div class="spinner"></div> Loading teams…</div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ CREATE / EDIT TEAM MODAL ═══════════════════════════════════════════ -->
<div class="modal fade" id="team-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="team-modal-title">Create Team</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

        <input type="hidden" id="edit-team-id" />

        <div class="mb-3">
          <label class="form-label">Team Name <span style="color:var(--accent-red)">*</span></label>
          <input type="text" id="team-name" class="form-control" placeholder="e.g. Backend Team" />
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="team-desc" class="form-control" rows="2"
                    placeholder="What does this team do?"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Team Lead</label>
          <select id="team-lead" class="form-select">
            <option value="">— Select Team Lead —</option>
          </select>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
            Team Lead is automatically added as a member.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Team Members</label>
          <div id="member-checkboxes"
               style="max-height:200px;overflow-y:auto;border:1px solid var(--border-color);
                      border-radius:8px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px">
            <div style="color:var(--text-muted)">Loading users…</div>
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="save-team-btn">Create Team</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ TEAM DETAIL / VIEW MODAL ══════════════════════════════════════════ -->
<div class="modal fade" id="view-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="view-title">Team Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="view-body"></div>
      <div class="modal-footer" id="view-footer"></div>
    </div>
  </div>
</div>

<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  if (!initPage('teams', 'Teams')) { throw new Error('Not authenticated'); }

  var currentUser = Api.getUser();
  var allUsers    = [];
  var allTeams    = [];
  var teamModal   = null;
  var viewModal   = null;
  var editingId   = null;

  // ── Role helpers ─────────────────────────────────────────────────────────
  function getRole() {
    return ((currentUser?.role?.name || currentUser?.role || '') + '').toUpperCase();
  }
  function canManage() {
    return getRole() === 'ADMIN' || getRole() === 'MANAGER';
  }
  function isAdmin() { return getRole() === 'ADMIN'; }

  // ── Load data ─────────────────────────────────────────────────────────────
  async function loadAll() {
    var [teams, users] = await Promise.all([Api.getTeams(), Api.getUsers()]);
    allTeams = teams || [];
    allUsers = users || [];
    renderTeamsGrid();
    populateUserDropdowns();

    // Show create button for ADMIN / MANAGER
    if (canManage()) {
      document.getElementById('btn-create-team').style.display = 'inline-flex';
    }
  }

  // ── Populate user selects + checkboxes ────────────────────────────────────
  function populateUserDropdowns() {
    var leadSel = document.getElementById('team-lead');
    leadSel.innerHTML = '<option value="">— Select Team Lead —</option>' +
      allUsers.map(function(u) {
        return '<option value="' + u.id + '">' + _esc(u.name) + ' (' + getRoleName(u) + ')</option>';
      }).join('');

    var box = document.getElementById('member-checkboxes');
    if (!allUsers.length) {
      box.innerHTML = '<div style="color:var(--text-muted)">No users found</div>';
      return;
    }
    box.innerHTML = allUsers.map(function(u) {
      return '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">' +
        '<input type="checkbox" class="member-cb" value="' + u.id + '" style="width:16px;height:16px" />' +
        _esc(u.name) + ' <span style="color:var(--text-muted);font-size:11px">(' + getRoleName(u) + ')</span>' +
      '</label>';
    }).join('');
  }

  function getRoleName(u) {
    return ((u.role?.name || u.role || 'developer') + '').toLowerCase();
  }

  function getCheckedMemberIds() {
    return Array.from(document.querySelectorAll('.member-cb:checked')).map(function(cb){
      return parseInt(cb.value);
    });
  }

  // ── Render teams grid ─────────────────────────────────────────────────────
  function renderTeamsGrid() {
    var grid = document.getElementById('teams-grid');
    if (!allTeams.length) {
      grid.innerHTML =
        '<div class="empty-state" style="grid-column:1/-1">' +
          '<div class="empty-state-icon">🏢</div>' +
          '<h6>No teams yet</h6>' +
          (canManage() ? '<p style="color:var(--text-muted)">Click "+ Create Team" to get started.</p>' : '') +
        '</div>';
      return;
    }
    grid.innerHTML = allTeams.map(renderTeamCard).join('');
  }

  function renderTeamCard(team) {
    var leadName  = team.teamLead ? _esc(team.teamLead.name) : '<span style="color:var(--text-muted)">No lead set</span>';
    var memberCnt = team.members ? team.members.length : 0;

    var actions =
      '<button class="btn btn-secondary btn-sm" onclick="viewTeam(' + team.id + ')">👁 View</button>';

    if (canManage()) {
      actions += ' <button class="btn btn-primary btn-sm" onclick="openEditModal(' + team.id + ')">✏️ Edit</button>';
    }
    if (isAdmin()) {
      actions += ' <button class="btn btn-danger btn-sm" onclick="deleteTeam(' + team.id + ')">🗑</button>';
    }

    return '<div class="user-card" style="min-height:auto">' +
      '<div style="font-size:18px;margin-bottom:8px">🏢</div>' +
      '<div class="user-card-name">' + _esc(team.name) + '</div>' +
      (team.description ? '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">' + _esc(team.description) + '</div>' : '') +
      '<div style="font-size:13px;margin-bottom:4px"><strong>Lead:</strong> ' + leadName + '</div>' +
      '<div style="font-size:13px;margin-bottom:12px"><strong>Members:</strong> ' + memberCnt + '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' + actions + '</div>' +
    '</div>';
  }

  // ── View team detail ──────────────────────────────────────────────────────
  async function viewTeam(id) {
    var team = await Api.getTeam(id);
    if (!team) return;
    document.getElementById('view-title').textContent = '🏢 ' + team.name;

    var membersList = team.members && team.members.length
      ? team.members.map(function(m) {
          var isLead = team.teamLead && team.teamLead.id === m.id;
          return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--border-color)">' +
            '<div style="width:32px;height:32px;border-radius:50%;background:var(--accent-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">' +
              getInitials(m.name) +
            '</div>' +
            '<div>' +
              '<div style="font-size:13px;font-weight:600">' + _esc(m.name) + (isLead ? ' <span style="font-size:10px;background:#3fb950;color:#fff;padding:1px 6px;border-radius:10px;margin-left:4px">LEAD</span>' : '') + '</div>' +
              '<div style="font-size:11px;color:var(--text-muted)">' + _esc(m.email) + '</div>' +
            '</div>' +
          '</div>';
        }).join('')
      : '<div style="color:var(--text-muted)">No members yet</div>';

    document.getElementById('view-body').innerHTML =
      '<div style="margin-bottom:16px">' +
        (team.description ? '<p style="font-size:13px;color:var(--text-secondary)">' + _esc(team.description) + '</p>' : '') +
        '<div style="font-size:13px;margin-bottom:4px"><strong>Created by:</strong> ' + _esc(team.createdBy?.name || 'Unknown') + '</div>' +
      '</div>' +
      '<div style="font-size:13px;font-weight:600;margin-bottom:8px">Members (' + (team.members?.length || 0) + ')</div>' +
      membersList;

    var footerBtns = '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>';
    if (canManage()) {
      footerBtns += ' <button class="btn btn-primary" onclick="viewModal && viewModal.hide(); openEditModal(' + team.id + ')">✏️ Edit Team</button>';
    }
    document.getElementById('view-footer').innerHTML = footerBtns;

    if (!viewModal) viewModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('view-modal'));
    viewModal.show();
  }
  window.viewTeam = viewTeam;

  // ── Create team modal ─────────────────────────────────────────────────────
  function openCreateModal() {
    editingId = null;
    document.getElementById('edit-team-id').value = '';
    document.getElementById('team-name').value    = '';
    document.getElementById('team-desc').value    = '';
    document.getElementById('team-lead').value    = '';
    document.querySelectorAll('.member-cb').forEach(function(cb){ cb.checked = false; });
    document.getElementById('team-modal-title').textContent = 'Create Team';
    document.getElementById('save-team-btn').textContent    = 'Create Team';
    if (!teamModal) teamModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('team-modal'));
    teamModal.show();
  }

  // ── Edit team modal ───────────────────────────────────────────────────────
  async function openEditModal(id) {
    editingId = id;
    var team = await Api.getTeam(id);
    if (!team) return;
    document.getElementById('edit-team-id').value = id;
    document.getElementById('team-name').value    = team.name;
    document.getElementById('team-desc').value    = team.description || '';
    document.getElementById('team-lead').value    = team.teamLead ? team.teamLead.id : '';

    var memberIds = team.members ? team.members.map(function(m){ return m.id; }) : [];
    document.querySelectorAll('.member-cb').forEach(function(cb){
      cb.checked = memberIds.includes(parseInt(cb.value));
    });

    document.getElementById('team-modal-title').textContent = 'Edit Team';
    document.getElementById('save-team-btn').textContent    = 'Save Changes';
    if (!teamModal) teamModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('team-modal'));
    teamModal.show();
  }
  window.openEditModal = openEditModal;

  // ── Save (create or update) ───────────────────────────────────────────────
  document.getElementById('save-team-btn').addEventListener('click', async function() {
    var name    = document.getElementById('team-name').value.trim();
    var desc    = document.getElementById('team-desc').value.trim();
    var leadId  = document.getElementById('team-lead').value;
    var memberIds = getCheckedMemberIds();

    if (!name) { Toast.error('Team name is required'); return; }

    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Saving…';

    var payload = {
      name:        name,
      description: desc || null,
      teamLeadId:  leadId ? parseInt(leadId) : null,
      memberIds:   memberIds
    };

    var result;
    if (editingId) {
      result = await Api.updateTeam(editingId, payload);
    } else {
      result = await Api.createTeam(payload);
    }

    btn.disabled = false;
    btn.textContent = editingId ? 'Save Changes' : 'Create Team';

    if (result) {
      Toast.success(editingId ? 'Team updated!' : 'Team created!');
      if (teamModal) teamModal.hide();
      await loadAll();
    }
  });

  // ── Delete team ───────────────────────────────────────────────────────────
  async function deleteTeam(id) {
    var team = allTeams.find(function(t){ return t.id === id; });
    if (!confirm('Delete team "' + (team ? team.name : id) + '"? This cannot be undone.')) return;
    var r = await Api.deleteTeam(id);
    if (r || r === null) {
      Toast.success('Team deleted');
      await loadAll();
    }
  }
  window.deleteTeam = deleteTeam;

  // ── Wire buttons ──────────────────────────────────────────────────────────
  document.getElementById('btn-create-team').addEventListener('click', openCreateModal);

  // ── Init ──────────────────────────────────────────────────────────────────
  loadAll();
</script>
</body>
</html>
