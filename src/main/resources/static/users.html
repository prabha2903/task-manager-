<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Team</title>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">

      <!-- ═══ ADVANCED SEARCH & FILTERS ═══════════════════════════════════ -->
      <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:18px 20px;margin-bottom:20px">

        <!-- Search bar -->
        <div class="search-input-wrap" style="margin-bottom:14px">
          <span class="search-icon">🔍</span>
          <input type="text" id="user-search" class="form-control"
                 placeholder="Search by name or email…" />
        </div>

        <!-- Filter dropdowns -->
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">

          <div style="display:flex;flex-direction:column;gap:4px;min-width:140px">
            <label style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">Role</label>
            <select id="role-filter" class="form-select form-select-sm">
              <option value="">All Roles</option>
              <option value="ADMIN">Admin</option>
              <option value="MANAGER">Manager</option>
              <option value="PROJECT_LEAD">Project Lead</option>
              <option value="DEVELOPER">Developer</option>
            </select>
          </div>

          <div style="display:flex;flex-direction:column;gap:4px;min-width:160px">
            <label style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">Project</label>
            <select id="project-filter" class="form-select form-select-sm">
              <option value="">All Projects</option>
            </select>
          </div>

          <div style="display:flex;flex-direction:column;gap:4px;min-width:150px">
            <label style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">Task Status</label>
            <select id="status-filter" class="form-select form-select-sm">
              <option value="">All Statuses</option>
              <option value="BACKLOG">Backlog</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="REVIEW">Review</option>
              <option value="QA">QA</option>
              <option value="BLOCKED">Blocked</option>
              <option value="DONE">Done</option>
            </select>
          </div>

          <div style="display:flex;flex-direction:column;gap:4px;min-width:150px">
            <label style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">Assignment</label>
            <select id="assignment-filter" class="form-select form-select-sm">
              <option value="">All</option>
              <option value="ASSIGNED">Assigned</option>
              <option value="UNASSIGNED">Unassigned</option>
            </select>
          </div>

        </div>

        <!-- Action buttons + result count -->
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <button id="btn-apply" class="btn btn-primary btn-sm">Apply Filters</button>
          <button id="btn-clear" class="btn btn-secondary btn-sm">✕ Clear Filters</button>
          <span id="result-count" style="font-size:13px;color:var(--text-muted);margin-left:auto"></span>
        </div>
      </div>

      <!-- ═══ MEMBERS GRID ═══════════════════════════════════════════════ -->
      <div id="users-grid"
           style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px">
        <div class="loading-spinner" style="grid-column:1/-1">
          <div class="spinner"></div> Loading team…
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ═══ CHANGE ROLE MODAL ════════════════════════════════════════════════ -->
<div class="modal fade" id="role-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change User Role</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom:14px">
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">USER</div>
          <div id="role-user-name" style="font-size:15px;font-weight:700"></div>
        </div>
        <label class="form-label">Select Role</label>
        <select id="role-select" class="form-select">
          <option value="ADMIN">Admin</option>
          <option value="MANAGER">Manager</option>
          <option value="PROJECT_LEAD">Project Lead</option>
          <option value="DEVELOPER">Developer</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="save-role-btn">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  if (!initPage('users', 'Team')) { throw new Error('Not authenticated'); }

  // ─── State ────────────────────────────────────────────────────────────────
  var selectedUserId = null;
  var roleModal      = null;
  var currentUser    = Api.getUser();

  function isAdmin() {
    var r = (
      currentUser?.role?.name ||
      currentUser?.role ||
      (currentUser?.roles && currentUser.roles[0]) ||
      ''
    ).toString().toUpperCase();
    return r === 'ADMIN';
  }

  // ─── Load projects for dropdown ───────────────────────────────────────────
  async function loadProjectDropdown() {
    var projects = await Api.getProjects();
    var sel = document.getElementById('project-filter');
    if (projects && projects.length) {
      projects.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value       = p.id;
        opt.textContent = p.name;
        sel.appendChild(opt);
      });
    }
  }

  // ─── Build filter params from UI ─────────────────────────────────────────
  function getFilterParams() {
    return {
      keyword:          document.getElementById('user-search').value.trim(),
      role:             document.getElementById('role-filter').value,
      projectId:        document.getElementById('project-filter').value,
      taskStatus:       document.getElementById('status-filter').value,
      assignmentStatus: document.getElementById('assignment-filter').value
    };
  }

  // ─── Fetch filtered users from backend ───────────────────────────────────
  async function applyFilters() {
    showLoading();
    var params = getFilterParams();
    // remove empty params
    Object.keys(params).forEach(function(k){ if (!params[k]) delete params[k]; });

    var data;
    // If no filter at all, use the regular list endpoint
    if (Object.keys(params).length === 0) {
      data = await Api.getUsers();
    } else {
      data = await Api.get('/users/filter', params);
    }

    renderUsers(data || []);
  }

  function showLoading() {
    document.getElementById('users-grid').innerHTML =
      '<div class="loading-spinner" style="grid-column:1/-1"><div class="spinner"></div> Loading…</div>';
    document.getElementById('result-count').textContent = '';
  }

  // ─── Render users grid ────────────────────────────────────────────────────
  function renderUsers(list) {
    var grid = document.getElementById('users-grid');
    var count = document.getElementById('result-count');

    count.textContent = 'Showing ' + list.length + ' member' + (list.length !== 1 ? 's' : '');

    if (!list.length) {
      grid.innerHTML =
        '<div class="empty-state" style="grid-column:1/-1">' +
          '<div class="empty-state-icon">🔍</div>' +
          '<h6>No team members match your filters</h6>' +
          '<p style="font-size:13px;color:var(--text-muted)">Try adjusting or clearing your filters.</p>' +
        '</div>';
      return;
    }

    grid.innerHTML = list.map(function(u) {
      var initials = (u.name || 'U').split(' ')
                      .map(function(w){ return w[0] || ''; })
                      .join('').toUpperCase().slice(0, 2);

      var role = (
        u.role?.name ||
        u.role ||
        (u.roles && u.roles[0]) ||
        'DEVELOPER'
      ).toString().toUpperCase();

      return '<div class="user-card">' +
        '<div class="user-card-avatar">' + initials + '</div>' +
        '<div class="user-card-name">'  + _esc(u.name)  + '</div>' +
        '<div class="user-card-email">' + _esc(u.email) + '</div>' +
        roleBadge(role) +
        (isAdmin() ?
          '<div style="margin-top:12px">' +
            '<button class="btn btn-primary btn-sm w-100" ' +
              'onclick="changeRolePrompt(' + u.id + ',\'' + _esc(u.name) + '\',\'' + role + '\')">' +
              'Change Role' +
            '</button>' +
          '</div>'
        : '') +
      '</div>';
    }).join('');
  }

  // ─── Role-change modal ────────────────────────────────────────────────────
  function changeRolePrompt(userId, userName, currentRole) {
    selectedUserId = userId;
    document.getElementById('role-user-name').textContent = userName;
    document.getElementById('role-select').value = currentRole;
    if (!roleModal) {
      roleModal = bootstrap.Modal.getOrCreateInstance(
        document.getElementById('role-modal')
      );
    }
    roleModal.show();
  }
  window.changeRolePrompt = changeRolePrompt;

  document.getElementById('save-role-btn').addEventListener('click', async function() {
    if (!selectedUserId) return;
    var newRole = document.getElementById('role-select').value;
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Saving…';
    var result = await Api.changeUserRole(selectedUserId, newRole);
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    if (result) {
      Toast.success('Role updated successfully');
      roleModal.hide();
      applyFilters();
    } else {
      Toast.error('Failed to update role');
    }
  });

  // ─── Filter button events ─────────────────────────────────────────────────
  document.getElementById('btn-apply').addEventListener('click', applyFilters);

  document.getElementById('btn-clear').addEventListener('click', function() {
    document.getElementById('user-search').value      = '';
    document.getElementById('role-filter').value      = '';
    document.getElementById('project-filter').value   = '';
    document.getElementById('status-filter').value    = '';
    document.getElementById('assignment-filter').value = '';
    applyFilters();
  });

  // Live search on keystroke (debounced)
  document.getElementById('user-search').addEventListener('input',
    debounce(applyFilters, 350));

  // ─── Init ────────────────────────────────────────────────────────────────
  loadProjectDropdown();
  applyFilters();
</script>
</body>
</html>
