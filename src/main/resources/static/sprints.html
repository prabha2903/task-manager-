<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sprints — TaskFlow</title>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">

      <!-- Header -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="margin:0;font-size:20px;font-weight:700">🏃 Sprints</h2>
          <p style="margin:4px 0 0;font-size:13px;color:var(--text-muted)">Manage sprints across all your projects</p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <select id="project-select" class="form-select" style="width:200px">
            <option value="">Select Project…</option>
          </select>
          <button id="btn-create" class="btn btn-primary" style="display:none">+ New Sprint</button>
        </div>
      </div>

      <!-- AI Assignment Banner -->
      <div id="ai-banner" style="display:none;background:linear-gradient(135deg,#1e3a5f,#0d2137);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div>
          <div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:4px">🤖 AI Task Assignment</div>
          <div style="font-size:12px;color:#8bafd4">Let AI suggest the best team member for each task. You review and approve.</div>
        </div>
        <button id="btn-ai-suggest" class="btn btn-primary btn-sm">🤖 AI Suggest Assignments</button>
      </div>

      <!-- Sprints list -->
      <div id="sprints-list">
        <div style="text-align:center;padding:60px;color:var(--text-muted)">
          <div style="font-size:48px;margin-bottom:12px">📋</div>
          <p>Select a project to view sprints</p>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Create/Edit Sprint Modal -->
<div class="modal fade" id="sprint-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="sprint-modal-title">Create Sprint</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-sprint-id"/>
        <div class="mb-3">
          <label class="form-label">Sprint Name <span style="color:red">*</span></label>
          <input type="text" id="sprint-name" class="form-control" placeholder="e.g. Sprint 1"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Sprint Goal</label>
          <textarea id="sprint-goal" class="form-control" rows="2" placeholder="What do we aim to complete?"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="mb-3">
            <label class="form-label">Start Date <span style="color:red">*</span></label>
            <input type="date" id="sprint-start" class="form-control"/>
          </div>
          <div class="mb-3">
            <label class="form-label">End Date <span style="color:red">*</span></label>
            <input type="date" id="sprint-end" class="form-control"/>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="save-sprint-btn">Create Sprint</button>
      </div>
    </div>
  </div>
</div>

<!-- Add Tasks to Sprint Modal -->
<div class="modal fade" id="tasks-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Tasks to Sprint</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="max-height:400px;overflow-y:auto">
        <div id="task-checkboxes">Loading tasks…</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="add-tasks-btn">Add Selected Tasks</button>
      </div>
    </div>
  </div>
</div>

<!-- AI Suggestions Modal -->
<div class="modal fade" id="ai-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">🤖 AI Suggested Assignments</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="ai-modal-body">Loading…</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="approve-all-btn">✅ Approve All</button>
      </div>
    </div>
  </div>
</div>

<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
if (!initPage('sprints','Sprints')) throw new Error('Not authenticated');

var currentUser   = Api.getUser();
var selectedProject = null;
var allProjects   = [];
var allSprints    = [];
var editingSprintId = null;
var addingToSprintId = null;
var aiSuggestions = [];
var sprintModal   = null;
var tasksModal    = null;
var aiModal       = null;

function role() { return ((currentUser?.role?.name || currentUser?.role || '') + '').toUpperCase(); }
function canManage() { return role()==='ADMIN'||role()==='MANAGER'||role()==='PROJECT_LEAD'; }

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  var projects = await Api.getProjects();
  allProjects  = projects || [];

  var sel = document.getElementById('project-select');
  sel.innerHTML = '<option value="">Select Project…</option>' +
    allProjects.map(function(p){
      return '<option value="'+p.id+'">'+_esc(p.name)+'</option>';
    }).join('');

  if (canManage()) document.getElementById('btn-create').style.display='inline-flex';

  // Check AI status
  var aiStatus = await Api.aiStatus();
  if (aiStatus && aiStatus.enabled && canManage()) {
    document.getElementById('ai-banner').style.display='flex';
  }
}

// ── Load sprints for selected project ─────────────────────────────────────────
document.getElementById('project-select').addEventListener('change', async function() {
  selectedProject = this.value ? parseInt(this.value) : null;
  if (!selectedProject) {
    document.getElementById('sprints-list').innerHTML =
      '<div style="text-align:center;padding:60px;color:var(--text-muted)"><p>Select a project to view sprints</p></div>';
    return;
  }
  await loadSprints();
});

async function loadSprints() {
  if (!selectedProject) return;
  var sprints = await Api.getSprints(selectedProject);
  allSprints = sprints || [];
  renderSprints();
}

function renderSprints() {
  var list = document.getElementById('sprints-list');
  if (!allSprints.length) {
    list.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted)">' +
      '<div style="font-size:48px;margin-bottom:12px">🏃</div>' +
      '<p>No sprints yet for this project.</p>' +
      (canManage() ? '<button class="btn btn-primary btn-sm" onclick="openCreateModal()">+ Create First Sprint</button>' : '') +
    '</div>';
    return;
  }

  list.innerHTML = allSprints.map(function(s) {
    var tasks     = s.tasks || [];
    var done      = tasks.filter(function(t){return t.status==='DONE';}).length;
    var pct       = tasks.length ? Math.round((done/tasks.length)*100) : 0;
    var statusColor = {PLANNED:'#8b949e',ACTIVE:'#388bfd',COMPLETED:'#3fb950',CANCELLED:'#f85149'}[s.status]||'#8b949e';

    var actions = '<button class="btn btn-secondary btn-sm" onclick="openAddTasksModal('+s.id+')">+ Tasks</button>';
    if (canManage()) {
      actions += ' <button class="btn btn-primary btn-sm" onclick="openEditModal('+s.id+')">✏️</button>';
      if (s.status === 'PLANNED')
        actions += ' <button class="btn btn-success btn-sm" onclick="changeStatus('+s.id+',\'ACTIVE\')">▶ Start</button>';
      if (s.status === 'ACTIVE')
        actions += ' <button class="btn btn-warning btn-sm" onclick="changeStatus('+s.id+',\'COMPLETED\')">✅ Complete</button>';
      actions += ' <button class="btn btn-danger btn-sm" onclick="deleteSprint('+s.id+')">🗑</button>';
    }

    return '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-body">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px">' +
          '<div>' +
            '<div style="font-size:16px;font-weight:700;margin-bottom:4px">'+_esc(s.name)+'</div>' +
            (s.goal ? '<div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">🎯 '+_esc(s.goal)+'</div>' : '') +
            '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
              '<span style="font-size:11px;color:var(--text-muted)">📅 '+formatDate(s.startDate)+' → '+formatDate(s.endDate)+'</span>' +
              '<span style="font-size:11px;font-weight:700;color:'+statusColor+'">● '+s.status+'</span>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap">'+actions+'</div>' +
        '</div>' +
        (tasks.length ?
          '<div style="margin-bottom:8px">' +
            '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:4px">' +
              '<span>'+done+' / '+tasks.length+' tasks completed</span><span>'+pct+'%</span>' +
            '</div>' +
            '<div style="height:8px;background:var(--border-color);border-radius:4px;overflow:hidden">' +
              '<div style="height:100%;width:'+pct+'%;background:#3fb950;border-radius:4px;transition:width .4s"></div>' +
            '</div>' +
          '</div>' : '') +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px">' +
          tasks.map(function(t){
            return '<span style="padding:2px 8px;border-radius:10px;background:var(--bg-tertiary)">'+_esc(t.title)+'</span>';
          }).join('') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── Create/Edit Modal ─────────────────────────────────────────────────────────
function openCreateModal() {
  editingSprintId = null;
  document.getElementById('edit-sprint-id').value = '';
  document.getElementById('sprint-name').value  = '';
  document.getElementById('sprint-goal').value  = '';
  document.getElementById('sprint-start').value = '';
  document.getElementById('sprint-end').value   = '';
  document.getElementById('sprint-modal-title').textContent = 'Create Sprint';
  document.getElementById('save-sprint-btn').textContent    = 'Create Sprint';
  if (!sprintModal) sprintModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('sprint-modal'));
  sprintModal.show();
}
window.openCreateModal = openCreateModal;

async function openEditModal(id) {
  var sprint = allSprints.find(function(s){return s.id===id;});
  if (!sprint) return;
  editingSprintId = id;
  document.getElementById('edit-sprint-id').value = id;
  document.getElementById('sprint-name').value  = sprint.name;
  document.getElementById('sprint-goal').value  = sprint.goal || '';
  document.getElementById('sprint-start').value = sprint.startDate || '';
  document.getElementById('sprint-end').value   = sprint.endDate || '';
  document.getElementById('sprint-modal-title').textContent = 'Edit Sprint';
  document.getElementById('save-sprint-btn').textContent    = 'Save Changes';
  if (!sprintModal) sprintModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('sprint-modal'));
  sprintModal.show();
}
window.openEditModal = openEditModal;

document.getElementById('save-sprint-btn').addEventListener('click', async function() {
  var name  = document.getElementById('sprint-name').value.trim();
  var goal  = document.getElementById('sprint-goal').value.trim();
  var start = document.getElementById('sprint-start').value;
  var end   = document.getElementById('sprint-end').value;

  if (!name)  { Toast.error('Sprint name is required'); return; }
  if (!start) { Toast.error('Start date is required'); return; }
  if (!end)   { Toast.error('End date is required'); return; }
  if (end < start) { Toast.error('End date must be after start date'); return; }
  if (!editingSprintId && !selectedProject) { Toast.error('Select a project first'); return; }
  var btn = this; btn.disabled=true; btn.textContent='Saving…';

  var payload = { name, goal: goal||null, startDate: start, endDate: end };
  var r = editingSprintId
    ? await Api.updateSprint(editingSprintId, payload)
    : await Api.createSprint(selectedProject, payload);

  btn.disabled=false; btn.textContent=editingSprintId?'Save Changes':'Create Sprint';

  if (r) {
    Toast.success(editingSprintId ? 'Sprint updated!' : 'Sprint created!');
    sprintModal.hide();
    loadSprints();
  }
});

// ── Status change ─────────────────────────────────────────────────────────────
async function changeStatus(id, status) {
  var msg = status==='ACTIVE' ? 'Start this sprint?' : 'Complete this sprint?';
  if (!confirm(msg)) return;
  var r = await Api.changeSprintStatus(id, status);
  if (r) { Toast.success('Sprint '+status); loadSprints(); }
}
window.changeStatus = changeStatus;

// ── Delete sprint ─────────────────────────────────────────────────────────────
async function deleteSprint(id) {
  if (!confirm('Delete this sprint?')) return;
  var r = await Api.deleteSprint(id);
  if (r !== false) { Toast.success('Sprint deleted'); loadSprints(); }
}
window.deleteSprint = deleteSprint;

// ── Add tasks to sprint ───────────────────────────────────────────────────────
async function openAddTasksModal(sprintId) {
  addingToSprintId = sprintId;
  var sprint = allSprints.find(function(s){return s.id===sprintId;});
  var projectTasks = await Api.getTasks({ projectId: selectedProject, size: 200 });
  var tasks = projectTasks ? (projectTasks.content || projectTasks) : [];
  var sprintTaskIds = sprint ? sprint.tasks.map(function(t){return t.id;}) : [];

  document.getElementById('task-checkboxes').innerHTML = tasks.length
    ? tasks.map(function(t) {
        var inSprint = sprintTaskIds.includes(t.id);
        return '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0;border-bottom:.5px solid var(--border-color);font-size:13px">' +
          '<input type="checkbox" class="sprint-task-cb" value="'+t.id+'"'+(inSprint?' checked disabled':'')+' style="width:16px;height:16px"/>' +
          '<span>'+_esc(t.title)+'</span>' +
          statusBadge(t.status) +
          (inSprint ? '<span style="font-size:10px;color:var(--text-muted)">(already in sprint)</span>' : '') +
        '</label>';
      }).join('')
    : '<div style="color:var(--text-muted)">No tasks in this project</div>';

  if (!tasksModal) tasksModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('tasks-modal'));
  tasksModal.show();
}
window.openAddTasksModal = openAddTasksModal;

document.getElementById('add-tasks-btn').addEventListener('click', async function() {
  var checked = Array.from(document.querySelectorAll('.sprint-task-cb:checked:not(:disabled)'));
  if (!checked.length) { Toast.warning('Select at least one task'); return; }
  var btn = this; btn.disabled=true; btn.textContent='Adding…';
  var ok = 0;
  for (var cb of checked) {
    var r = await Api.addTaskToSprint(addingToSprintId, cb.value);
    if (r) ok++;
  }
  btn.disabled=false; btn.textContent='Add Selected Tasks';
  Toast.success(ok + ' task(s) added to sprint');
  tasksModal.hide();
  loadSprints();
});

// ── AI Suggestions ────────────────────────────────────────────────────────────
document.getElementById('btn-ai-suggest').addEventListener('click', async function() {
  if (!selectedProject) { Toast.warning('Select a project first'); return; }
  var btn = this;
  btn.disabled=true; btn.textContent='🤖 Analyzing…';

  var suggestions = await Api.aiSuggest(selectedProject);

  btn.disabled=false; btn.textContent='🤖 AI Suggest Assignments';

  if (!suggestions) {
    Toast.error('AI service unavailable. Please set AI_API_KEY or assign manually.');
    return;
  }

  aiSuggestions = suggestions;

  if (!aiModal) aiModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('ai-modal'));

  if (!suggestions.length) {
    document.getElementById('ai-modal-body').innerHTML =
      '<div style="text-align:center;padding:20px;color:var(--text-muted)">No assignment suggestions — all tasks may already be assigned.</div>';
  } else {
    document.getElementById('ai-modal-body').innerHTML =
      '<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">Review and approve AI suggestions. Nothing is changed until you approve.</div>' +
      '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
        '<thead><tr>' +
          '<th style="padding:8px;text-align:left;border-bottom:1px solid var(--border-color)">Task</th>' +
          '<th style="padding:8px;text-align:left;border-bottom:1px solid var(--border-color)">Suggested Member</th>' +
          '<th style="padding:8px;text-align:left;border-bottom:1px solid var(--border-color)">Reason</th>' +
          '<th style="padding:8px;border-bottom:1px solid var(--border-color)">Action</th>' +
        '</tr></thead>' +
        '<tbody>' + suggestions.map(function(s, i) {
          return '<tr id="ai-row-'+i+'">' +
            '<td style="padding:8px;border-bottom:.5px solid var(--border-color)">'+_esc(s.taskTitle)+'</td>' +
            '<td style="padding:8px;border-bottom:.5px solid var(--border-color)">👤 '+_esc(s.suggestedUserName)+'</td>' +
            '<td style="padding:8px;border-bottom:.5px solid var(--border-color);font-size:11px;color:var(--text-muted)">'+_esc(s.reason||'AI recommendation')+'</td>' +
            '<td style="padding:8px;border-bottom:.5px solid var(--border-color)">' +
              '<button class="btn btn-success btn-sm" onclick="approveOne('+i+')">✅ Approve</button>' +
            '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table>';
  }

  aiModal.show();
});

async function approveOne(index) {
  var s = aiSuggestions[index];
  var r = await Api.aiApprove(s.taskId, s.suggestedUserId);
  if (r) {
    Toast.success('Assigned '+s.taskTitle+' → '+s.suggestedUserName);
    var row = document.getElementById('ai-row-'+index);
    if (row) row.style.opacity='0.4';
    aiSuggestions[index]._approved = true;
  }
}
window.approveOne = approveOne;

document.getElementById('approve-all-btn').addEventListener('click', async function() {
  var btn = this; btn.disabled=true; btn.textContent='Approving…';
  var count = 0;
  for (var i=0; i<aiSuggestions.length; i++) {
    if (!aiSuggestions[i]._approved) {
      var r = await Api.aiApprove(aiSuggestions[i].taskId, aiSuggestions[i].suggestedUserId);
      if (r) { count++; aiSuggestions[i]._approved=true; }
    }
  }
  btn.disabled=false; btn.textContent='✅ Approve All';
  Toast.success(count+' assignments approved!');
  aiModal.hide();
});

// ── Wire button ───────────────────────────────────────────────────────────────
document.getElementById('btn-create').addEventListener('click', openCreateModal);

// ── Init ──────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
