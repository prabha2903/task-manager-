<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Search — TaskFlow</title>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">

      <div style="margin-bottom:20px">
        <h2 style="margin:0 0 4px;font-size:20px;font-weight:700">🔍 Global Search</h2>
        <p style="margin:0;font-size:13px;color:var(--text-muted)">Search across all tasks by title, description, assignee, or project</p>
      </div>

      <!-- Search bar -->
      <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:16px 20px;margin-bottom:20px">
        <div class="search-input-wrap" style="margin-bottom:14px">
          <span class="search-icon" style="font-size:18px">🔍</span>
          <input type="text" id="search-q" class="form-control"
                 placeholder="Search tasks, assignees, descriptions…"
                 style="font-size:15px;padding:10px 14px"/>
        </div>

        <!-- Filters -->
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <div style="display:flex;flex-direction:column;gap:4px;min-width:140px">
            <label style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Project</label>
            <select id="filter-project" class="form-select form-select-sm">
              <option value="">All Projects</option>
            </select>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;min-width:140px">
            <label style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Status</label>
            <select id="filter-status" class="form-select form-select-sm">
              <option value="">All Statuses</option>
              <option value="BACKLOG">Backlog</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="REVIEW">Review</option>
              <option value="QA">QA</option>
              <option value="BLOCKED">Blocked</option>
              <option value="DONE">Done</option>
            </select>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;min-width:140px">
            <label style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Priority</label>
            <select id="filter-priority" class="form-select form-select-sm">
              <option value="">All Priorities</option>
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
            </select>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <button id="btn-search" class="btn btn-primary btn-sm">Search</button>
          <button id="btn-clear"  class="btn btn-secondary btn-sm">✕ Clear</button>
          <span id="result-count" style="font-size:13px;color:var(--text-muted);margin-left:auto"></span>
        </div>
      </div>

      <!-- Results -->
      <div id="search-results">
        <div style="text-align:center;padding:60px;color:var(--text-muted)">
          <div style="font-size:48px;margin-bottom:12px">🔍</div>
          <p>Enter a keyword to search tasks</p>
        </div>
      </div>

      <!-- Pagination -->
      <div id="pagination" style="display:none;text-align:center;margin-top:20px">
        <button id="btn-prev" class="btn btn-secondary btn-sm">← Prev</button>
        <span id="page-info" style="margin:0 12px;font-size:13px;color:var(--text-muted)"></span>
        <button id="btn-next" class="btn btn-secondary btn-sm">Next →</button>
      </div>

    </div>
  </div>
</div>

<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
if (!initPage('search','Search')) throw new Error('Not authenticated');

var currentPage = 0;
var totalPages  = 0;

// ── Load projects for filter ───────────────────────────────────────────────────
async function initFilters() {
  var projects = await Api.getProjects();
  var sel = document.getElementById('filter-project');
  if (projects && projects.length) {
    projects.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value       = p.id;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
  }
}

// ── Do search ─────────────────────────────────────────────────────────────────
async function doSearch(page) {
  page = page || 0;
  currentPage = page;

  var q         = document.getElementById('search-q').value.trim();
  var status    = document.getElementById('filter-status').value;
  var priority  = document.getElementById('filter-priority').value;
  var projectId = document.getElementById('filter-project').value;

  var params = { page: page, size: 20 };
  if (q)         params.q         = q;
  if (status)    params.status    = status;
  if (priority)  params.priority  = priority;
  if (projectId) params.projectId = projectId;

  document.getElementById('search-results').innerHTML =
    '<div class="loading-spinner"><div class="spinner"></div> Searching…</div>';

  var data = await Api.searchTasks(params);

  if (!data) {
    document.getElementById('search-results').innerHTML =
      '<div style="text-align:center;padding:40px;color:var(--text-muted)">Search failed. Please try again.</div>';
    return;
  }

  var items = data.content || (Array.isArray(data) ? data : []);
  totalPages = data.totalPages || 1;
  var total  = data.totalElements !== undefined ? data.totalElements : items.length;

  document.getElementById('result-count').textContent =
    'Showing ' + items.length + ' of ' + total + ' result' + (total !== 1 ? 's' : '');

  if (!items.length) {
    document.getElementById('search-results').innerHTML =
      '<div style="text-align:center;padding:40px">' +
        '<div style="font-size:48px;margin-bottom:12px">😔</div>' +
        '<h6>No results found</h6>' +
        '<p style="font-size:13px;color:var(--text-muted)">Try different keywords or adjust your filters.</p>' +
      '</div>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  document.getElementById('search-results').innerHTML =
    '<div style="display:flex;flex-direction:column;gap:10px">' +
    items.map(function(t) {
      var project  = t.project  ? _esc(t.project.name)                     : '—';
      var assignee = t.assignedUser ? _esc(t.assignedUser.name)             : 'Unassigned';
      var desc     = t.description ? _esc(t.description.slice(0, 120)) + (t.description.length > 120 ? '…' : '') : '';

      return '<div class="card" onclick="location.href=\'task-detail.html?id='+t.id+'\'" ' +
        'style="cursor:pointer;transition:border-color .15s" ' +
        'onmouseenter="this.style.borderColor=\'var(--accent-blue)\'" ' +
        'onmouseleave="this.style.borderColor=\'\'">' +
        '<div class="card-body">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:8px">' +
            '<div style="font-size:15px;font-weight:600">'+_esc(t.title)+'</div>' +
            '<div style="display:flex;gap:6px">'+statusBadge(t.status)+priorityBadge(t.priority)+'</div>' +
          '</div>' +
          (desc ? '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">'+desc+'</div>' : '') +
          '<div style="display:flex;gap:16px;font-size:12px;color:var(--text-muted);flex-wrap:wrap">' +
            '<span>📁 '+project+'</span>' +
            '<span>👤 '+assignee+'</span>' +
            (t.dueDate ? '<span>📅 '+formatDate(t.dueDate)+'</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('') +
    '</div>';

  // Pagination
  var pagDiv = document.getElementById('pagination');
  if (totalPages > 1) {
    pagDiv.style.display = 'block';
    document.getElementById('page-info').textContent = 'Page ' + (currentPage + 1) + ' of ' + totalPages;
    document.getElementById('btn-prev').disabled = currentPage === 0;
    document.getElementById('btn-next').disabled = currentPage >= totalPages - 1;
  } else {
    pagDiv.style.display = 'none';
  }
}

// ── Event listeners ───────────────────────────────────────────────────────────
document.getElementById('btn-search').addEventListener('click', function() { doSearch(0); });

document.getElementById('search-q').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch(0);
});

document.getElementById('btn-clear').addEventListener('click', function() {
  document.getElementById('search-q').value       = '';
  document.getElementById('filter-status').value  = '';
  document.getElementById('filter-priority').value= '';
  document.getElementById('filter-project').value = '';
  document.getElementById('result-count').textContent = '';
  document.getElementById('search-results').innerHTML =
    '<div style="text-align:center;padding:60px;color:var(--text-muted)">'+
      '<div style="font-size:48px;margin-bottom:12px">🔍</div><p>Enter a keyword to search tasks</p></div>';
  document.getElementById('pagination').style.display = 'none';
});

document.getElementById('btn-prev').addEventListener('click', function() {
  if (currentPage > 0) doSearch(currentPage - 1);
});
document.getElementById('btn-next').addEventListener('click', function() {
  if (currentPage < totalPages - 1) doSearch(currentPage + 1);
});

// ── Auto-search if q in URL ───────────────────────────────────────────────────
var urlQ = new URLSearchParams(location.search).get('q');
if (urlQ) {
  document.getElementById('search-q').value = urlQ;
  doSearch(0);
}

initFilters();
</script>
</body>
</html>
