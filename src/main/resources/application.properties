spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

server.port=${PORT:8080}
# ── Phase 3: file upload settings ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ── Phase 4 — external integrations ──────────────────────────────────────────
# AI (Gemini) — set AI_API_KEY env var
ai.api.key=${AI_API_KEY:}

# Slack — set SLACK_WEBHOOK_URL env var
slack.webhook.url=${SLACK_WEBHOOK_URL:}

# GitHub — set GITHUB_TOKEN for higher rate limits (optional)
github.token=${GITHUB_TOKEN:}

# Email (SMTP) — set MAIL_* env vars to enable email notifications
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
